<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asian Tiers | Competitive Rankings</title>
    <!-- Tailwind CSS v4 CDN Engine -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Custom UI Transitions & Canvas Architecture */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0b0f19; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 99px; }
        
        /* Rank Badge Angle Shimmers */
        .rank-banner-ribbon {
            position: relative;
            clip-path: polygon(0 0, 100% 0, 75% 100%, 0% 100%);
        }
        
        /* Isolated Profile Card Components matching user screenshot metrics */
        .player-row-card {
            background: #111625;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .player-row-card:hover {
            border-color: rgba(244, 63, 94, 0.3);
            background: #151b2d;
            transform: translateX(2px);
        }

        /* Pixelated Asset Rendering Configuration for authentic game icons */
        .pixelated-render {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-200 antialiased min-h-screen custom-scrollbar">

    <!-- Top Navigation Workspace Header -->
    <nav class="backdrop-blur-md bg-[#0b0f19]/90 border-b border-slate-900/60 px-6 py-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <span class="text-xl font-black tracking-widest bg-gradient-to-r from-rose-500 via-orange-400 to-amber-400 bg-clip-text text-transparent">ASIAN TIERS</span>
            <div class="flex items-center space-x-4">
                <input type="text" id="playerSearch" placeholder="Filter active players..." class="bg-[#05070f] border border-slate-800 rounded-xl px-4 py-2 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-rose-500/50 w-44 sm:w-64 transition-all duration-300">
                <a href="admin.html" class="text-xs text-slate-500 hover:text-rose-400 font-bold transition">Admin Desk</a>
            </div>
        </div>
    </nav>

    <!-- Main Section Panel Content -->
    <main class="max-w-6xl mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
        
        <!-- Filter Tabs for specific query operations -->
        <div class="flex items-center space-x-2 overflow-x-auto pb-2 custom-scrollbar">
            <button onclick="switchActiveCategory('overall')" id="tab-overall" class="tab-btn px-4 py-2 rounded-xl text-xs font-black tracking-widest uppercase transition-all duration-200 bg-rose-500/10 text-rose-400 border border-rose-500/30">Overall</button>
            <button onclick="switchActiveCategory('sword')" id="tab-sword" class="tab-btn px-4 py-2 rounded-xl text-xs font-black tracking-widest uppercase transition-all duration-200 text-slate-400 hover:bg-slate-900 border border-transparent">Sword</button>
            <button onclick="switchActiveCategory('axe')" id="tab-axe" class="tab-btn px-4 py-2 rounded-xl text-xs font-black tracking-widest uppercase transition-all duration-200 text-slate-400 hover:bg-slate-900 border border-transparent">Axe</button>
            <button onclick="switchActiveCategory('diamond_smp')" id="tab-diamond_smp" class="tab-btn px-4 py-2 rounded-xl text-xs font-black tracking-widest uppercase transition-all duration-200 text-slate-400 hover:bg-slate-900 border border-transparent">Diamond SMP</button>
            <button onclick="switchActiveCategory('mace')" id="tab-mace" class="tab-btn px-4 py-2 rounded-xl text-xs font-black tracking-widest uppercase transition-all duration-200 text-slate-400 hover:bg-slate-900 border border-transparent">Mace</button>
            <button onclick="switchActiveCategory('smp')" id="tab-smp" class="tab-btn px-4 py-2 rounded-xl text-xs font-black tracking-widest uppercase transition-all duration-200 text-slate-400 hover:bg-slate-900 border border-transparent">SMP</button>
            <button onclick="switchActiveCategory('nethpot')" id="tab-nethpot" class="tab-btn px-4 py-2 rounded-xl text-xs font-black tracking-widest uppercase transition-all duration-200 text-slate-400 hover:bg-slate-900 border border-transparent">Nethpot</button>
            <button onclick="switchActiveCategory('spearmace')" id="tab-spearmace" class="tab-btn px-4 py-2 rounded-xl text-xs font-black tracking-widest uppercase transition-all duration-200 text-slate-400 hover:bg-slate-900 border border-transparent">Spearmace</button>
            <button onclick="switchActiveCategory('crystal')" id="tab-crystal" class="tab-btn px-4 py-2 rounded-xl text-xs font-black tracking-widest uppercase transition-all duration-200 text-slate-400 hover:bg-slate-900 border border-transparent">Crystal</button>
        </div>

        <!-- Meta Structural Columns Mapping Description Text Labels -->
        <div class="grid grid-cols-12 px-6 text-[10px] font-black uppercase tracking-widest text-slate-600 text-center sm:text-left">
            <div class="col-span-1 text-center">#</div>
            <div class="col-span-4 pl-12">Player Identification / Statistics</div>
            <div class="col-span-2 text-center">Country</div>
            <div class="col-span-5 text-right pr-6">Tracked Kit Matrix Configurations</div>
        </div>

        <!-- Target Container Grid Elements Viewport Output -->
        <section id="mcpvpLayoutContainer" class="space-y-3.5">
            <div class="p-12 text-center text-slate-600 text-xs font-bold tracking-wide">Initializing local player entries array stream mapping context...</div>
        </section>
    </main>

    <script>
        let globalDatasetArray = [];
        let currentFilterKey = 'overall';

        // Official Minecraft item asset definitions
        const kitAssetMatrix = {
            'sword': { label: 'Sword', img: 'https://minecraft.wiki/images/Diamond_Sword_JE3_BE3.png' },
            'axe': { label: 'Axe', img: 'https://minecraft.wiki/images/Netherite_Axe_JE2.png' },
            'diamond_smp': { label: 'Diamond SMP', img: 'https://minecraft.wiki/images/Diamond_Chestplate_JE3_BE3.png' },
            'mace': { label: 'Mace', img: 'https://minecraft.wiki/images/Mace_JE1_BE1.png' },
            'smp': { label: 'SMP', img: 'https://minecraft.wiki/images/Grass_Block_JE4_BE3.png' },
            'nethpot': { label: 'Nethpot', img: 'https://minecraft.wiki/images/Splash_Potion_of_Healing_JE1_BE1.png' },
            'spearmace': { label: 'Spearmace', img: 'https://minecraft.wiki/images/Trident_JE2_BE2.png' },
            'crystal': { label: 'Crystal', img: 'https://minecraft.wiki/images/End_Crystal_JE2_BE2.png' }
        };

        const tierBadgeColors = {
            'HT1': 'text-emerald-400 border-emerald-900/60', 'HT2': 'text-emerald-400 border-emerald-900/40',
            'HT3': 'text-orange-400 border-orange-950', 'HT4': 'text-orange-400 border-orange-950',
            'MT1': 'text-amber-400 border-amber-950', 'MT2': 'text-amber-400 border-amber-950',
            'LT1': 'text-yellow-500 border-yellow-950', 'LT2': 'text-yellow-600 border-yellow-950/60'
        };

        function getTierStyle(tier) {
            return tierBadgeColors[tier] || 'text-slate-500 border-slate-900';
        }

        function convertCountryToFlag(code) {
            if(!code || code === 'AS') return '🌏';
            return code.toUpperCase().split('').map(c => String.fromCodePoint(127397 + c.charCodeAt(0))).join('');
        }

        fetch('data/players.json?nocache=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                globalDatasetArray = data;
                renderMcPvPRows();
            })
            .catch(() => {
                document.getElementById('mcpvpLayoutContainer').innerHTML = `<div class="p-8 text-center text-xs text-red-400 border border-red-950 rounded-xl">Failed to resolve localized json parameters. Check deployment variables.</div>`;
            });

        function switchActiveCategory(key) {
            currentFilterKey = key;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.className = "tab-btn px-4 py-2 rounded-xl text-xs font-black tracking-widest uppercase transition-all duration-200 text-slate-400 hover:bg-slate-900 border border-transparent");
            document.getElementById(`tab-${key}`).className = "tab-btn px-4 py-2 rounded-xl text-xs font-black tracking-widest uppercase transition-all duration-200 bg-rose-500/10 text-rose-400 border border-rose-500/30";
            renderMcPvPRows();
        }

        function renderMcPvPRows() {
            const output = document.getElementById('mcpvpLayoutContainer');
            const searchVal = document.getElementById('playerSearch').value.toLowerCase();

            let playersCopy = [...globalDatasetArray].filter(p => p.username.toLowerCase().includes(searchVal));
            
            if(currentFilterKey === 'overall') {
                playersCopy.sort((a,b) => b.overall_points - a.overall_points);
            } else {
                playersCopy.sort((a,b) => {
                    const tA = a.kits[currentFilterKey] || '?';
                    const tB = b.kits[currentFilterKey] || '?';
                    if(tA === '?') return 1; if(tB === '?') return -1;
                    return tA.localeCompare(tB);
                });
            }

            if(playersCopy.length === 0) {
                output.innerHTML = `<div class="p-12 text-center text-slate-600 text-xs">No records available matching specified criteria queries.</div>`;
                return;
            }

            output.innerHTML = "";
            playersCopy.forEach((player, loopIdx) => {
                const globalRank = loopIdx + 1;
                
                let rankBackground = "bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950";
                if(globalRank === 2) rankBackground = "bg-gradient-to-r from-slate-300 to-slate-400 text-slate-950";
                if(globalRank === 3) rankBackground = "bg-gradient-to-r from-amber-700 to-amber-900 text-white";
                if(globalRank > 3) rankBackground = "bg-[#161d30] text-slate-500 border-r border-slate-900";

                output.innerHTML += `
                    <div class="player-row-card grid grid-cols-12 items-center rounded-xl overflow-hidden py-3 sm:py-0 shadow-xl">
                        
                        <div class="col-span-12 sm:col-span-1 flex justify-center sm:justify-start h-full mb-2 sm:mb-0">
                            <div class="rank-banner-ribbon ${rankBackground} w-full sm:w-16 h-10 sm:h-20 flex items-center justify-center font-black text-base tracking-wider font-mono">
                                ${globalRank}
                            </div>
                        </div>

                        <div class="col-span-12 sm:col-span-4 flex items-center justify-center sm:justify-start space-x-4 pl-0 sm:pl-4 mb-3 sm:mb-0">
                            <img src="https://cravatar.eu/avatar/${player.username}/40.png" alt="" class="w-11 h-11 rounded-xl border border-slate-800 bg-[#020617] shadow-md">
                            <div class="text-center sm:text-left">
                                <h4 class="font-extrabold text-white text-base tracking-wide flex items-center justify-center sm:justify-start space-x-1.5">
                                    <span>${player.username}</span>
                                    <svg class="w-3.5 h-3.5 text-rose-500 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
                                </h4>
                                <p class="text-[11px] font-bold text-slate-400 mt-0.5 uppercase tracking-wide">
                                    <span class="text-rose-400">${player.overall_tier || 'LT6'}</span> 
                                    <span class="text-slate-600 font-medium">(${player.overall_points} Pts)</span>
                                </p>
                            </div>
                        </div>

                        <div class="col-span-12 sm:col-span-2 flex items-center justify-center text-2xl filter drop-shadow mb-3 sm:mb-0">
                            <span class="border border-slate-900 px-3 py-1 rounded-xl bg-[#05070f]/40">${convertCountryToFlag(player.country_code)}</span>
                        </div>

                        <div class="col-span-12 sm:col-span-5 flex flex-wrap items-center justify-center sm:justify-end gap-2.5 pr-0 sm:pr-6">
                            ${Object.keys(kitAssetMatrix).map(key => renderItemBlockNode(key, player.kits[key])).join('')}
                        </div>

                    </div>
                `;
            });
        }

        // Row sub-component layout compiling Minecraft item image modules
        function renderItemBlockNode(key, tierVal) {
            const blockConfig = kitAssetMatrix[key];
            const activeTier = tierVal || '?';
            const isHighlight = currentFilterKey === key ? 'border-rose-500/50 bg-[#1a1423]' : 'border-[#0a0e18] bg-[#05070f]';
            
            return `
                <div class="border rounded-xl px-2 py-1.5 min-w-[58px] flex flex-col items-center justify-center shadow-inner relative group cursor-help transition ${isHighlight}">
                    <img src="${blockConfig.img}" alt="${blockConfig.label}" class="w-5 h-5 pixelated-render object-contain group-hover:scale-110 transition duration-200">
                    <span class="text-[10px] font-black font-mono mt-1 ${getTierStyle(activeTier)}">${activeTier}</span>
                    
                    <div class="absolute bottom-full mb-2 hidden group-hover:block z-50 bg-slate-950 border border-slate-800 text-[9px] font-bold text-slate-300 px-2 py-1 rounded shadow-xl whitespace-nowrap pointer-events-none uppercase tracking-widest">
                        ${blockConfig.label}
                    </div>
                </div>
            `;
        }

        document.getElementById('playerSearch').addEventListener('input', renderMcPvPRows);
    </script>
</body>
</html>
