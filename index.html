<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MCPvP Tiers - Public Leaderboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">
    <nav class="border-b border-slate-800 bg-slate-900/50 px-6 py-4 flex justify-between items-center">
        <span class="text-xl font-bold tracking-wider text-cyan-400">MCPVP TIERS</span>
        <a href="admin.html" class="text-sm bg-slate-900 border border-slate-800 hover:bg-slate-800 px-4 py-2 rounded-lg font-medium text-slate-300 transition">Admin Dashboard Login</a>
    </nav>

    <main class="max-w-6xl mx-auto p-4 md:p-8 space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex gap-4 shadow-xl">
            <input type="text" id="searchBar" placeholder="Filter players dynamically by username..." class="bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 w-full text-slate-200">
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-2xl">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="bg-slate-950 border-b border-slate-800 text-slate-400 font-semibold tracking-wide uppercase text-xs">
                        <th class="p-4 w-20 text-center">Rank</th>
                        <th class="p-4">Player</th>
                        <th class="p-4">Overall Tier</th>
                        <th class="p-4">Diamond SMP</th>
                        <th class="p-4">Mace</th>
                        <th class="p-4 text-right">Points</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody" class="divide-y divide-slate-800/40">
                    <!-- Dynamic Rows Inserted Here -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const getTierBadgeClass = (tier) => {
            if(tier.startsWith('HT')) return 'bg-red-950 text-red-400 border-red-800/60';
            if(tier.startsWith('MT')) return 'bg-orange-950 text-orange-400 border-orange-800/60';
            return 'bg-yellow-950 text-yellow-400 border-yellow-800/60';
        };

        fetch('data/players.json?nocache=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('leaderboardBody');
                data.sort((a,b) => b.overall_points - a.overall_points);
                
                window.renderTable = (filterText = "") => {
                    container.innerHTML = "";
                    let visibleRank = 1;
                    data.filter(p => p.username.toLowerCase().includes(filterText.toLowerCase())).forEach(player => {
                        const badgeClass = getTierBadgeClass(player.overall_tier);
                        container.innerHTML += `
                            <tr class="hover:bg-slate-800/30 transition">
                                <td class="p-4 text-center font-bold text-slate-500">#${visibleRank++}</td>
                                <td class="p-4 font-semibold text-white flex items-center gap-2">
                                    <img src="https://mc-heads.net/avatar/${player.username}/24" class="w-6 h-6 rounded" alt="" onerror="this.style.display='none'">
                                    <span>${player.username}</span>
                                    <span class="text-xs font-normal text-slate-500 bg-slate-950/60 px-1.5 py-0.5 rounded border border-slate-800">${player.country_code}</span>
                                </td>
                                <td class="p-4"><span class="px-2.5 py-1 rounded border text-xs font-black tracking-wide ${badgeClass}">${player.overall_tier}</span></td>
                                <td class="p-4 text-slate-400 font-medium">${player.kits.diamond_smp || '?'}</td>
                                <td class="p-4 text-slate-400 font-medium">${player.kits.mace || '?'}</td>
                                <td class="p-4 text-right font-mono font-bold text-cyan-400 text-base">${player.overall_points}</td>
                            </tr>
                        `;
                    });
                };
                renderTable();
            });

        document.getElementById('searchBar').addEventListener('input', (e) => renderTable(e.target.value));
    </script>
</body>
</html>
