name: Update Player Rankings Backend

on:
  repository_dispatch:
    types: [admin_update_player]

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Execute Serverless Data Update
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './data/players.json';
            
            const payload = context.payload.client_payload;
            let players = JSON.parse(fs.readFileSync(path, 'utf8'));
            
            const index = players.findIndex(p => p.username.toLowerCase() === payload.username.toLowerCase());
            
            const updatedPlayer = {
              username: payload.username,
              country_code: payload.country_code || "US",
              overall_points: parseFloat(payload.overall_points),
              overall_tier: payload.overall_tier,
              kits: {
                diamond_smp: payload.diamond_smp || "?",
                netherite_pot: payload.netherite_pot || "?",
                mace: payload.mace || "?",
                shield: payload.shield || "?"
              }
            };

            if (index !== -1) {
              players[index] = updatedPlayer;
            } else {
              players.push(updatedPlayer);
            }
            
            fs.writeFileSync(path, JSON.stringify(players, null, 2));

      - name: Commit and Push Changes to GitHub
        run: |
          git config --global user.name "GitHub Serverless Backend"
          git config --global user.email "actions@github.com"
          git add data/players.json
          git commit -m "Admin Action: Synchronized ranking updates for ${{ github.event.client_payload.username }}"
          git push
