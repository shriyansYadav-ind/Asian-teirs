<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCPvP Tiers - Leaderboards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #030712;
            background-image: 
                radial-gradient(at 50% 0%, rgba(14, 165, 233, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(168, 85, 247, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .font-teko { font-family: 'Teko', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* Animated Grid Background */
        .bg-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        /* Glassmorphism Card Effect */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .glass-panel-interactive {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-panel-interactive:hover {
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
            transform: translateY(-2px);
        }

        /* Neon Glows & Tier Badges */
        .tier-badge {
            font-family: 'Teko', sans-serif;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            text-shadow: 0 0 8px currentColor;
        }

        .tier-ht { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.5); }
        .tier-mt { background: rgba(249, 115, 22, 0.15); color: #fdba74; border: 1px solid rgba(249, 115, 22, 0.5); }
        .tier-lt { background: rgba(234, 179, 8, 0.15); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.5); }
        .tier-none { background: rgba(71, 85, 105, 0.2); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.2); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #38bdf8; }

        /* Game Mode Tab Glow */
        .mode-tab.active {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.25) 0%, rgba(59, 130, 246, 0.1) 100%);
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3), inset 0 0 10px rgba(56, 189, 248, 0.2);
        }

        /* Top 3 Glow Highlights */
        .rank-1 { background: linear-gradient(90deg, rgba(234, 179, 8, 0.12) 0%, transparent 100%); }
        .rank-2 { background: linear-gradient(90deg, rgba(203, 213, 225, 0.08) 0%, transparent 100%); }
        .rank-3 { background: linear-gradient(90deg, rgba(217, 119, 6, 0.08) 0%, transparent 100%); }
    </style>
</head>
<body class="bg-grid text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- Top Navigation Bar -->
    <nav class="sticky top-0 z-50 glass-panel border-b border-slate-800/80 px-4 md:px-8 py-3.5 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-teko font-bold text-2xl text-slate-950 shadow-lg shadow-cyan-500/30">
                PVP
            </div>
            <div>
                <span class="font-teko text-2xl font-bold tracking-widest bg-clip-text text-transparent bg-gradient-to-r from-white via-cyan-200 to-cyan-400">
                    MCPVP TIERS
                </span>
                <span class="hidden sm:inline-block text-[10px] uppercase font-mono px-2 py-0.5 ml-2 rounded bg-cyan-950/80 text-cyan-400 border border-cyan-800/50">Season 2026</span>
            </div>
        </div>
        <a href="admin.html" class="glass-panel-interactive text-xs font-semibold uppercase tracking-wider bg-slate-900/80 hover:bg-cyan-500/10 border border-slate-700/60 hover:border-cyan-400/50 text-slate-300 hover:text-cyan-300 px-4 py-2 rounded-xl transition-all flex items-center gap-2">
            <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            Admin Panel
        </a>
    </nav>

    <!-- Main Content Container -->
    <main class="max-w-7xl w-full mx-auto p-4 md:p-8 space-y-6 flex-1">

        <!-- Game Mode Selection Navigation -->
        <div class="space-y-2">
            <div class="flex items-center justify-between">
                <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase font-mono">Select PvP Category</span>
                <span class="text-xs text-slate-500 font-mono" id="activeModeTitle">Viewing: Overall Standings</span>
            </div>
            
            <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-2.5" id="gameModeTabs">
                <button data-mode="overall" class="mode-tab active glass-panel-interactive px-3 py-3 rounded-xl border border-slate-800 text-slate-400 font-medium text-xs flex flex-col items-center gap-1.5 transition">
                    <span class="text-xl">🏆</span>
                    <span class="font-bold tracking-wide">Overall</span>
                </button>
                <button data-mode="diamond_smp" class="mode-tab glass-panel-interactive px-3 py-3 rounded-xl border border-slate-800 text-slate-400 font-medium text-xs flex flex-col items-center gap-1.5 transition">
                    <span class="text-xl">💎</span>
                    <span class="font-bold tracking-wide">Diamond SMP</span>
                </button>
                <button data-mode="mace" class="mode-tab glass-panel-interactive px-3 py-3 rounded-xl border border-slate-800 text-slate-400 font-medium text-xs flex flex-col items-center gap-1.5 transition">
                    <span class="text-xl">🔨</span>
                    <span class="font-bold tracking-wide">Mace PvP</span>
                </button>
                <button data-mode="crystal" class="mode-tab glass-panel-interactive px-3 py-3 rounded-xl border border-slate-800 text-slate-400 font-medium text-xs flex flex-col items-center gap-1.5 transition">
                    <span class="text-xl">🔮</span>
                    <span class="font-bold tracking-wide">Crystal PvP</span>
                </button>
                <button data-mode="lifesteal" class="mode-tab glass-panel-interactive px-3 py-3 rounded-xl border border-slate-800 text-slate-400 font-medium text-xs flex flex-col items-center gap-1.5 transition">
                    <span class="text-xl">❤️</span>
                    <span class="font-bold tracking-wide">Lifesteal</span>
                </button>
                <button data-mode="netherite_pot" class="mode-tab glass-panel-interactive px-3 py-3 rounded-xl border border-slate-800 text-slate-400 font-medium text-xs flex flex-col items-center gap-1.5 transition">
                    <span class="text-xl">🧪</span>
                    <span class="font-bold tracking-wide">Netherite Pot</span>
                </button>
                <button data-mode="axe" class="mode-tab glass-panel-interactive px-3 py-3 rounded-xl border border-slate-800 text-slate-400 font-medium text-xs flex flex-col items-center gap-1.5 transition">
                    <span class="text-xl">🪓</span>
                    <span class="font-bold tracking-wide">Axe & Shield</span>
                </button>
                <button data-mode="box_pvp" class="mode-tab glass-panel-interactive px-3 py-3 rounded-xl border border-slate-800 text-slate-400 font-medium text-xs flex flex-col items-center gap-1.5 transition">
                    <span class="text-xl">📦</span>
                    <span class="font-bold tracking-wide">Box PvP</span>
                </button>
            </div>
        </div>

        <!-- Dynamic Filter & Search Toolbar -->
        <div class="glass-panel rounded-2xl p-4 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="relative w-full md:w-96">
                <svg class="w-5 h-5 absolute left-3.5 top-3 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="searchBar" placeholder="Search player by IGN..." class="bg-slate-950/80 border border-slate-800 rounded-xl pl-11 pr-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 w-full text-slate-200 placeholder-slate-500 transition">
            </div>

            <div class="flex items-center gap-4 w-full md:w-auto justify-end">
                <div class="flex items-center gap-2 text-xs text-slate-400">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="playerCount">0 Players Registered</span>
                </div>
            </div>
        </div>

        <!-- Leaderboard Table Card -->
        <div class="glass-panel rounded-2xl overflow-hidden shadow-2xl border border-slate-800/80">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-950/90 border-b border-slate-800 text-slate-400 font-semibold tracking-wider uppercase text-[11px] font-mono">
                            <th class="p-4 w-16 text-center">Rank</th>
                            <th class="p-4">Player</th>
                            <th class="p-4 text-center">Current Tier</th>
                            <th class="p-4 text-center hidden md:table-cell">Diamond SMP</th>
                            <th class="p-4 text-center hidden md:table-cell">Mace</th>
                            <th class="p-4 text-center hidden lg:table-cell">Crystal</th>
                            <th class="p-4 text-center hidden lg:table-cell">Lifesteal</th>
                            <th class="p-4 text-right">Points</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody" class="divide-y divide-slate-800/40 font-medium">
                        <!-- Dynamic Rows Inserted Here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/60 py-6 text-center text-xs text-slate-500">
        <p>MCPvP Competitive Tierlist System &bull; Powered by Real-time Sync</p>
    </footer>

    <!-- Interactive Script -->
    <script>
        let currentMode = 'overall';
        let playerData = [];

        // Mock Fallback Data in case local player.json fetch fails or is absent
        const samplePlayers = [
            { username: "Plutonicdwarf91", country_code: "IN", overall_points: 2850, overall_tier: "HT1", kits: { diamond_smp: "HT1", mace: "HT1", crystal: "MT1", lifesteal: "HT2", netherite_pot: "MT2", axe: "HT1", box_pvp: "LT1" } },
            { username: "Spandan_PvP", country_code: "IN", overall_points: 2420, overall_tier: "HT2", kits: { diamond_smp: "HT2", mace: "MT1", crystal: "HT1", lifesteal: "MT1", netherite_pot: "LT1", axe: "MT2", box_pvp: "HT2" } },
            { username: "Smitidal", country_code: "IN", overall_points: 1980, overall_tier: "MT1", kits: { diamond_smp: "MT1", mace: "LT1", crystal: "MT2", lifesteal: "HT1", netherite_pot: "MT1", axe: "LT2", box_pvp: "LT2" } },
            { username: "Amaan_God", country_code: "US", overall_points: 1750, overall_tier: "MT2", kits: { diamond_smp: "LT1", mace: "HT2", crystal: "LT1", lifesteal: "LT2", netherite_pot: "HT2", axe: "MT1", box_pvp: "MT1" } },
            { username: "Shriyans_MC", country_code: "IN", overall_points: 1420, overall_tier: "LT1", kits: { diamond_smp: "LT2", mace: "LT2", crystal: "LT2", lifesteal: "MT2", netherite_pot: "LT2", axe: "LT1", box_pvp: "LT1" } }
        ];

        const getTierClass = (tier) => {
            if (!tier || tier === '?') return 'tier-none';
            if (tier.startsWith('HT')) return 'tier-ht';
            if (tier.startsWith('MT')) return 'tier-mt';
            return 'tier-lt';
        };

        const renderTable = (filterText = "") => {
            const container = document.getElementById('leaderboardBody');
            container.innerHTML = "";

            // Sort logic based on selected game mode
            let sortedData = [...playerData];
            if (currentMode === 'overall') {
                sortedData.sort((a, b) => (b.overall_points || 0) - (a.overall_points || 0));
            } else {
                const tierWeights = { "HT1": 6, "HT2": 5, "MT1": 4, "MT2": 3, "LT1": 2, "LT2": 1, "?": 0 };
                sortedData.sort((a, b) => {
                    const weightA = tierWeights[a.kits?.[currentMode]] || 0;
                    const weightB = tierWeights[b.kits?.[currentMode]] || 0;
                    return weightB - weightA;
                });
            }

            const filtered = sortedData.filter(p => p.username.toLowerCase().includes(filterText.toLowerCase()));
            document.getElementById('playerCount').innerText = `${filtered.length} Players Listed`;

            let rank = 1;
            filtered.forEach(player => {
                const currentTier = currentMode === 'overall' ? player.overall_tier : (player.kits?.[currentMode] || '?');
                const badgeStyle = getTierClass(currentTier);

                let rankGlowClass = "";
                let rankBadge = `#${rank}`;
                if (rank === 1) { rankGlowClass = "rank-1"; rankBadge = "🥇 #1"; }
                else if (rank === 2) { rankGlowClass = "rank-2"; rankBadge = "🥈 #2"; }
                else if (rank === 3) { rankGlowClass = "rank-3"; rankBadge = "🥉 #3"; }

                container.innerHTML += `
                    <tr class="hover:bg-slate-800/40 transition-colors duration-150 ${rankGlowClass}">
                        <td class="p-4 text-center font-bold font-mono text-sm ${rank <= 3 ? 'text-amber-400 font-extrabold' : 'text-slate-500'}">
                            ${rankBadge}
                        </td>
                        <td class="p-4 font-semibold text-white">
                            <div class="flex items-center gap-3">
                                <img src="https://mc-heads.net/avatar/${player.username}/32" class="w-8 h-8 rounded-lg border border-slate-700 shadow-md bg-slate-900" alt="" onerror="this.src='https://mc-heads.net/avatar/MNS/32'">
                                <div class="flex flex-col">
                                    <span class="hover:text-cyan-400 transition cursor-pointer flex items-center gap-1.5">
                                        ${player.username}
                                        <span class="text-[10px] font-mono text-slate-400 bg-slate-950/80 px-1.5 py-0.2 rounded border border-slate-800">${player.country_code || 'IN'}</span>
                                    </span>
                                </div>
                            </div>
                        </td>
                        <td class="p-4 text-center">
                            <span class="px-3 py-1 rounded-lg text-sm font-bold tier-badge ${badgeStyle}">
                                ${currentTier}
                            </span>
                        </td>
                        <td class="p-4 text-center hidden md:table-cell text-slate-400 font-mono text-xs">
                            <span class="px-2 py-0.5 rounded border border-slate-800/80 bg-slate-950/50">${player.kits?.diamond_smp || '?'}</span>
                        </td>
                        <td class="p-4 text-center hidden md:table-cell text-slate-400 font-mono text-xs">
                            <span class="px-2 py-0.5 rounded border border-slate-800/80 bg-slate-950/50">${player.kits?.mace || '?'}</span>
                        </td>
                        <td class="p-4 text-center hidden lg:table-cell text-slate-400 font-mono text-xs">
                            <span class="px-2 py-0.5 rounded border border-slate-800/80 bg-slate-950/50">${player.kits?.crystal || '?'}</span>
                        </td>
                        <td class="p-4 text-center hidden lg:table-cell text-slate-400 font-mono text-xs">
                            <span class="px-2 py-0.5 rounded border border-slate-800/80 bg-slate-950/50">${player.kits?.lifesteal || '?'}</span>
                        </td>
                        <td class="p-4 text-right font-mono font-extrabold text-cyan-400 text-base">
                            ${(player.overall_points || 0).toLocaleString()} <span class="text-[10px] text-cyan-600 font-normal">PTS</span>
                        </td>
                    </tr>
                `;
                rank++;
            });
        };

        // Tab Switching Handler
        document.querySelectorAll('.mode-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentMode = tab.getAttribute('data-mode');
                
                const modeName = tab.querySelector('span:last-child').innerText;
                document.getElementById('activeModeTitle').innerText = `Viewing: ${modeName} Tierlist`;
                
                renderTable(document.getElementById('searchBar').value);
            });
        });

        // Search Bar Event
        document.getElementById('searchBar').addEventListener('input', (e) => renderTable(e.target.value));

        // Fetch Data
        fetch('data/players.json?nocache=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                playerData = data;
                renderTable();
            })
            .catch(() => {
                // Fallback to sample data if JSON file isn't present during dev
                playerData = samplePlayers;
                renderTable();
            });
    </script>
</body>
</html>
